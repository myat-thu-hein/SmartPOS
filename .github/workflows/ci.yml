name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartpos
          POSTGRES_PASSWORD: smartpos
          POSTGRES_DB: smartpos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartpos" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://smartpos:smartpos@localhost:5432/smartpos_test
      TEST_DATABASE_URL: postgresql+psycopg://smartpos:smartpos@localhost:5432/smartpos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end UI smoke tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smartpos
          POSTGRES_PASSWORD: smartpos
          POSTGRES_DB: smartpos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartpos" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://smartpos:smartpos@localhost:5432/smartpos
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      LOG_FORMAT: console
      # Exercise the one-click demo sign-in as well (e2e/live-and-smart.spec.ts).
      DEMO_LOGIN_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Generate a throwaway demo password
        run: |
          pw="Ci-$(openssl rand -hex 12)-1"
          echo "::add-mask::$pw"
          echo "DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the backend with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed.demo --days 60
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health/ready && break; sleep 1; done
      - name: Build and start the frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
          NEXT_OUTPUT: standalone
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > ../frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload report and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            frontend.log
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t smartpos-backend:ci backend
      - run: docker build -t smartpos-frontend:ci frontend
